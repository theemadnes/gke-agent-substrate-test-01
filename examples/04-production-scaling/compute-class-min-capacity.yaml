# GKE ComputeClass with automated node pool creation, nested virtualization,
# high-density sysctl tuning, and a minimum warm capacity of 1 node.
#
# Notes:
#   - Every priority MUST specify an explicit `machineType` (not just
#     `machineFamily`) when using `minimumCapacity`.
#   - Do NOT set `nodePoolConfig.sandbox.type: microvm` (that enables Kata for
#     GKE Sandbox pods and taints nodes with `sandbox.gke.io/runtime=microvm`,
#     blocking Agent Substrate Workers).
#   - Do NOT use `podFamily` (Pod-based billing does not support nested virt).
#
# Usage:
#   kubectl apply -f examples/04-production-scaling/compute-class-min-capacity.yaml

apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: substrate-microvm
spec:
  priorityDefaults:
    enableNestedVirtualization: true
    nodeSystemConfig:
      linuxNodeConfig:
        sysctls:
          fs.inotify.max_user_instances: 65536
          fs.inotify.max_user_watches: 1048576
          net.ipv4.neigh.default.gc_thresh1: 4096
          net.ipv4.neigh.default.gc_thresh2: 16384
          net.ipv4.neigh.default.gc_thresh3: 32768
  priorities:
    - machineType: n4-standard-4
    - machineType: c3-standard-4
    - machineType: n2-standard-4
  nodePoolAutoCreation:
    enabled: true
  minimumCapacity:
    targetNodeCount: 1
  nodePoolConfig:
    imageType: cos_containerd
  whenUnsatisfiable: DoNotScaleUp
